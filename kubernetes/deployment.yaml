apiVersion: apps/v1
kind: Deployment
metadata:
  name: htmx-spring-boot
  namespace: default
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: htmx-spring-boot
  template:
    metadata:
      labels:
        app: htmx-spring-boot
    spec:
      imagePullSecrets:
        - name: registry-cicdrych
      containers:
        - name: htmx-spring-boot
          image: registry.digitalocean.com/cicdrych/htmx-spring-boot:SHA_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 1010