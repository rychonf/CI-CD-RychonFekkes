apiVersion: apps/v1
kind: Deployment
metadata:
  name: htmx-spring-boot
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate  # Rolling updates inschakelen
    rollingUpdate:
      maxUnavailable: 0  # Houd altijd een pod beschikbaar
      maxSurge: 1        # Sta toe dat er tijdelijk 1 extra pod draait tijdens de update
  selector:
    matchLabels:
      app: htmx-spring-boot
  template:
    metadata:
      labels:
        app: htmx-spring-boot
    spec:
      imagePullSecrets:
        - name: registry-cicdrych
      containers:
        - name: htmx-spring-boot
          image: registry.digitalocean.com/cicdrych/htmx-spring-boot:SHA_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 1010
          resources:
            requests:
              memory: "100Mi"
              cpu: "250m"
            limits:
              memory: "500Mi"
              cpu: "500m"
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -Xms128m -Xmx384m"