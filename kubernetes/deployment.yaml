apiVersion: apps/v1
kind: Deployment
metadata:
  name: htmx-spring-boot-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: htmx-spring-boot
  template:
    metadata:
      labels:
        app: htmx-spring-boot
    spec:
      imagePullSecrets:
        - name: digitalocean-registry-secret
      containers:
        - name: htmx-spring-boot
          image: registry.digitalocean.com/cicdrych/htmx-spring-boot:1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
