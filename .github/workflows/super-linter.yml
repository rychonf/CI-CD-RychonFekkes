name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ERRORS: true

          VALIDATE_JAVA: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JS: true
          VALIDATE_TYPESCRIPT: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true