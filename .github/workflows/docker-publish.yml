name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Build en Push naar DigitalOcean Registers
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install doctl (via snap)
        run: |
          sudo apt update
          sudo apt install -y snapd
          sudo snap install doctl

      - name: Debug doctl installatie
        run: |
          echo "Controleren of doctl correct is geïnstalleerd..."
          if command -v doctl &> /dev/null; then
            echo "doctl gevonden op $(which doctl)"
            doctl version
          else
            echo "ERROR: doctl is nog steeds niet geïnstalleerd!"
            exit 1
          fi

      - name: Authenticate DigitalOcean CLI (doctl)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Authenticeren bij DigitalOcean..."
          doctl auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"
          doctl account get || echo "ERROR: Authenticatie is mislukt!"
          echo "doctl is succesvol geauthenticeerd!"

      - name: Define image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Clean up old images in DigitalOcean Registry
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          KEEP_IMAGES=2

          # Haal alle manifests op en sorteer op aanmaakdatum
          IMAGES_TO_DELETE=$(doctl registry repository list-manifests cicdrych/htmx-spring-boot --format Digest,CreatedAt --no-header | sort -k2 | awk '{print $1}' | tail -n +$((KEEP_IMAGES+1)))

          if [ -n "$IMAGES_TO_DELETE" ]; then
            echo "Verwijderen van oude images..."
            echo "$IMAGES_TO_DELETE" | while read -r DIGEST; do
              echo "Verwijderen van image met digest: $DIGEST"
              doctl registry repository delete-manifest cicdrych/htmx-spring-boot --digest "$DIGEST" --force || echo "Fout bij verwijderen van $DIGEST"
            done
          else
            echo "Geen oude images om te verwijderen!"
          fi

      - name: Run DigitalOcean Garbage Collection
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Starten van DigitalOcean Garbage Collection..."
          doctl registry garbage-collection start --force || echo "Garbage Collection kan niet worden uitgevoerd."      

      - name: Build Docker image with Podman (Optimized)
        run: |
          podman build --squash -t registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to DigitalOcean Container Registry
        run: |
          podman login registry.digitalocean.com -u ${{ secrets.DIGITALOCEAN_USERNAME }} -p ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          podman push registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}

  # Job 2: Deploy naar Kubernetes
  deploy:
    runs-on: ubuntu-latest
    needs: build  # Zorgt ervoor dat de deploy job alleen draait als de build job slaagt

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kubectl
        run: |
          if kubectl version --client &> /dev/null; then
            echo "Kubectl is al geïnstalleerd."
          else
            echo "Kubectl niet gevonden, installeren..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi

      - name: Install doctl (via snap)
        run: |
          sudo apt update
          sudo apt install -y snapd
          sudo snap install doctl

      - name: Debug doctl installatie
        run: |
          echo "Controleren of doctl correct is geïnstalleerd..."
          if command -v doctl &> /dev/null; then
            echo "doctl gevonden op $(which doctl)"
            doctl version
          else
            echo "ERROR: doctl is nog steeds niet geïnstalleerd!"
            exit 1
          fi

      - name: Authenticate DigitalOcean CLI (doctl)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Authenticeren bij DigitalOcean..."
          doctl auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"
          doctl account get || echo "ERROR: Authenticatie is mislukt!"
          echo "doctl is succesvol geauthenticeerd!"      

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube && chmod 700 ~/.kube
          if command -v snap &> /dev/null && snap list doctl &> /dev/null; then
            sudo snap connect doctl:kube-config
          fi
          doctl kubernetes cluster kubeconfig save k8s-1-32-1-do-0-ams3-1740567483244

      - name: Update Deployment YAML met Image Tag
        run: |
          IMAGE_NAME="registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}"
          sed -i "s|IMAGE_TAG_PLACEHOLDER|$IMAGE_NAME|g" kubernetes/deployment.yaml

      - name: Debug Deployment YAML
        run: cat kubernetes/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl rollout restart deployment/htmx-spring-boot