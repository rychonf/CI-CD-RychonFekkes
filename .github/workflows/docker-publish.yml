name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Build en Push naar DigitalOcean Registry
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Podman
        run: |
          if ! command -v podman &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          else
            echo "Podman is al geïnstalleerd"
          fi

      - name: Log in to DigitalOcean Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          registry: registry.digitalocean.com

      - name: Build Docker image with Podman
        run: |
          IMAGE_NAME=registry.digitalocean.com/cicdrych/htmx-spring-boot:latest
          podman build --rm -t $IMAGE_NAME .

      - name: Push Docker image to DigitalOcean Container Registry
        run: |
          IMAGE_NAME=registry.digitalocean.com/cicdrych/htmx-spring-boot:latest
          podman push $IMAGE_NAME

  # Job 2: Deploy naar Kubernetes
  deploy:
    runs-on: ubuntu-latest
    needs: build  # Zorgt ervoor dat de deploy job alleen draait als de build job slaagt

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create .kube directory
        run: |
          KUBE_DIR=$HOME/.kube
          if [ ! -d "$KUBE_DIR" ]; then
            mkdir -p $KUBE_DIR
          else
            echo "$KUBE_DIR bestaat al"
          fi

      - name: Set KUBECONFIG
        run: |
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x ./kubectl
            sudo mv ./kubectl /usr/local/bin/kubectl
          else
            echo "kubectl is al geïnstalleerd"
          fi

      - name: Deploy to Kubernetes
        run: |
          IMAGE_NAME=registry.digitalocean.com/cicdrych/htmx-spring-boot:latest
          sed -i "s|image: .*|image: $IMAGE_NAME|g" kubernetes/deployment.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl rollout status deployment/htmx-spring-boot-deployment