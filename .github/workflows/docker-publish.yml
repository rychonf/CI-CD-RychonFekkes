name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Build en Push naar DigitalOcean Registry
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install doctl (DigitalOcean CLI)
        run: |
          if ! command -v doctl &> /dev/null; then
            echo "doctl niet gevonden. Installeren..."
            curl -L https://github.com/digitalocean/doctl/releases/latest/download/doctl-$(uname -s)-$(uname -m) -o doctl
            chmod +x doctl
            sudo mv doctl /usr/local/bin/
          else
            echo "doctl is al geïnstalleerd."
          fi

      - name: Authenticate doctl
        run: doctl auth init --access-token ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Define IMAGE_TAG
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Delete old image from DigitalOcean Registry
        run: |
          doctl registry repository delete-manifest cicdrych/htmx-spring-boot --tag latest --force || echo "⚠️ Geen oude 'latest' image gevonden, overslaan."
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: |
          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | podman login registry.digitalocean.com --username "oauth2" --password-stdin

      - name: Build Docker image with Podman
        run: |
          podman build -t htmx-spring-boot:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to DigitalOcean Container Registry
        run: |
          podman tag localhost/htmx-spring-boot:${{ env.IMAGE_TAG }} registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}
          podman push registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}

  # Job 2: Deploy naar Kubernetes
  deploy:
    runs-on: ubuntu-latest
    needs: build  # Zorgt ervoor dat de deploy job alleen draait als de build job slaagt

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kubectl
        run: |
          if kubectl version --client &> /dev/null; then
            echo "Kubectl is al geïnstalleerd"
          else
            echo "Kubectl niet gevonden, installeren..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi

      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
          if [ ! -s kubeconfig ]; then
            echo "ERROR: Kubeconfig is leeg of verkeerd gedecodeerd!"
            exit 1
          fi
          mkdir -p ~/.kube
          mv kubeconfig ~/.kube/config
          chmod 600 ~/.kube/config
          export KUBECONFIG=~/.kube/config

      - name: Debug Kubernetes Connection
        run: |
          ls -lah ~/.kube
          cat ~/.kube/config
          kubectl config view
          kubectl cluster-info
          kubectl get nodes

      - name: Install yq (voor YAML-verwerking)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image in deployment.yaml
        run: |
          yq eval ".spec.template.spec.containers[0].image = \"registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}\"" -i kubernetes/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl rollout status deployment/htmx-spring-boot