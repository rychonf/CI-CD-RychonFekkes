name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Build en Push naar DigitalOcean Registers
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install doctl (via snap)
        run: |
          sudo apt update
          sudo apt install -y snapd
          sudo snap install doctl

      - name: Debug doctl installatie
        run: |
          echo "Controleren of doctl correct is geïnstalleerd..."
          if command -v doctl &> /dev/null; then
            echo "doctl gevonden op $(which doctl)"
            doctl version
          else
            echo "ERROR: doctl is nog steeds niet geïnstalleerd!"
            exit 1
          fi

      - name: Authenticate DigitalOcean CLI (doctl)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Authenticeren bij DigitalOcean..."
          doctl auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"
          doctl account get || echo "ERROR: Authenticatie is mislukt!"
          echo "doctl is succesvol geauthenticeerd!"

      - name: Define image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Clean up old images in DigitalOcean Registry
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          KEEP_IMAGES=2
          IMAGES_TO_DELETE=$(doctl registry repository list-manifests cicdrych/htmx-spring-boot --format Digest --no-header | tail -n +$((KEEP_IMAGES+1)))
          
          if [ -n "$IMAGES_TO_DELETE" ]; then
            echo "Verwijderen van oude images..."
            echo "$IMAGES_TO_DELETE" | xargs -I {} doctl registry repository delete-manifest cicdrych/htmx-spring-boot --digest {} --force
          else
            echo "Geen oude images om te verwijderen!"
          fi

      - name: Build Docker image with Podman (Optimized)
        run: |
          podman build --squash -t registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }} .

      - name: Controleer of de repository bestaat in DigitalOcean Registry
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Controleren of repository bestaat..."
          if ! doctl registry repository get cicdrych/htmx-spring-boot; then
            echo "Repository bestaat niet! Maken..."
            doctl registry repository create cicdrych/htmx-spring-boot
          else
            echo "Repository bestaat al!"
          fi

      - name: Push Docker image to DigitalOcean Container Registry
        run: |
          podman login registry.digitalocean.com -u ${{ secrets.DIGITALOCEAN_USERNAME }} -p ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
#          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | podman login --tls-verify=false --username "oauth2" --password-stdin registry.digitalocean.com
          podman push registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}

      - name: Run DigitalOcean Garbage Collection
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Starten van DigitalOcean Garbage Collection..."
          doctl registry garbage-collection start --force || echo "Garbage Collection kan niet worden uitgevoerd."

  # Job 2: Deploy naar Kubernetes
  deploy:
    runs-on: ubuntu-latest
    needs: build  # Zorgt ervoor dat de deploy job alleen draait als de build job slaagt

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kubectl
        run: |
          if kubectl version --client &> /dev/null; then
            echo "Kubectl is al geïnstalleerd."
          else
            echo "Kubectl niet gevonden, installeren..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi

      - name: Install doctl (via snap)
        run: |
          sudo apt update
          sudo apt install -y snapd
          sudo snap install doctl

      - name: Debug doctl installatie
        run: |
          echo "Controleren of doctl correct is geïnstalleerd..."
          if command -v doctl &> /dev/null; then
            echo "doctl gevonden op $(which doctl)"
            doctl version
          else
            echo "ERROR: doctl is nog steeds niet geïnstalleerd!"
            exit 1
          fi

      - name: Configure Kubernetes Kubeconfig
        run: |
          doctl kubernetes cluster kubeconfig save my-cluster     

      - name: Update image in deployment.yaml
        run: |
          IMAGE_NAME=registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}
          sed -i "s|image: .*|image: $IMAGE_NAME|g" kubernetes/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl rollout status deployment/htmx-spring-boot