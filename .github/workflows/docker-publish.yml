name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Installeer Podman indien dit nog niet is gebeurd
        run: |
          if ! command -v podman &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          else
            echo "Podman is al succesvol geïnstalleerd"
          fi

      - name: Installeer Digital Ocean command line via Snapd indien dit nog niet is gebeurd
        run: |
          if ! command -v snap &> /dev/null; then
            echo "Installeren van Snapd..."
            sudo apt update
            sudo apt install -y snapd
          else
            echo "Snapd is al succesvol geïnstalleerd"
          fi

          if ! snap list | grep -q doctl; then
            echo "Installeren van doctl..."
            sudo snap install doctl
          else
            echo "doctl is al succesvol geïnstalleerd"
          fi

      - name: Extra controle op de doctl installatie
        run: |
          echo "Controleren of doctl correct is geïnstalleerd..."
          if command -v doctl &> /dev/null; then
            echo "doctl gevonden op $(which doctl)"
            doctl version
          else
            echo "ERROR: doctl is nog steeds niet geïnstalleerd!"
            exit 1
          fi

      - name: Authenticate van de Digital Ocean Command line (doctl)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Authenticeren bij DigitalOcean..."
          doctl auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"
          doctl account get || echo "ERROR: Authenticatie is mislukt!"
          echo "doctl is succesvol geauthenticeerd!"

      - name: de sha in een Image tag variabele stoppen voor beter versie beheer
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

#      - name: Haal de lijst met manifests op en verwijder oude images
#        run: |
#            echo "Ophalen van alle image manifests..."
#            ALL_IMAGES=$(doctl registry repository list-manifests htmx-spring-boot --output json)
#
#            echo "Alle images in de repository (gesorteerd op push-tijd):"
#            echo "$ALL_IMAGES" | jq -r '.[] | "\(.digest) - \(.pushed_at)"'
#
#            OLD_IMAGES=$(echo "$ALL_IMAGES" | jq -r 'sort_by(.pushed_at) | .[0:-1] | .[].digest')
#
#            if [ -z "$OLD_IMAGES" ]; then
#                echo "Geen oude images om te verwijderen. Exiting..."
#                exit 0
#            fi
#
#            echo "De volgende images worden verwijderd:"
#            echo "$OLD_IMAGES"
#
#            for IMAGE in $OLD_IMAGES; do
#                echo "Verwijderen van image: $IMAGE"
#                doctl registry repository delete-manifest htmx-spring-boot $IMAGE --force
#            done
#
#            echo "Opruimen voltooid!"

      - name: Leeg de Digital Ocean Garbage Collection
        run: |
          echo "Starten van DigitalOcean Garbage Collection..."
          doctl registry garbage-collection start --force || echo "Garbage Collection kan niet worden uitgevoerd."      

      - name: Bouw de Docker image met Podman
        run: |
          podman build --squash -t registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }} .

      - name: Push Docker image naar de gewenste DigitalOcean Container Registry
        run: |
          podman login registry.digitalocean.com -u ${{ secrets.DIGITALOCEAN_USERNAME }} -p ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          podman push registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Installeren van de kubernetes command line indien dit nog niet is gebeurd
        run: |
          if kubectl version --client &> /dev/null; then
            echo "Kubectl is al geïnstalleerd."
          else
            echo "Kubectl niet gevonden, installeren..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi
          
      - name: Installeer Podman indien dit nog niet is gebeurd
        run: |
          if ! command -v podman &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          else
            echo "Podman is al succesvol geïnstalleerd"
          fi

      - name: Installeer Digital Ocean command line via Snapd indien dit nog niet is gebeurd
        run: |
          if ! command -v snap &> /dev/null; then
            echo "Installeren van Snapd..."
            sudo apt update
            sudo apt install -y snapd
          else
            echo "Snapd is al succesvol geïnstalleerd"
          fi

          if ! snap list | grep -q doctl; then
            echo "Installeren van doctl..."
            sudo snap install doctl
          else
            echo "doctl is al succesvol geïnstalleerd"
          fi

      - name: Extra controle op doctl installatie
        run: |
          echo "Controleren of doctl correct is geïnstalleerd..."
          if command -v doctl &> /dev/null; then
            echo "doctl gevonden op $(which doctl)"
            doctl version
          else
            echo "ERROR: doctl is nog steeds niet geïnstalleerd!"
            exit 1
          fi

      - name: Authenticate Digital Ocean CLI (doctl)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          echo "Authenticeren bij DigitalOcean..."
          doctl auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"
          doctl account get || echo "ERROR: Authenticatie is mislukt!"
          echo "doctl is succesvol geauthenticeerd!" 

      - name: Configuratie van Kubernetes
        run: |
          mkdir -p ~/.kube && chmod 700 ~/.kube
          if command -v snap &> /dev/null && snap list doctl &> /dev/null; then
            sudo snap connect doctl:kube-config
          fi
          doctl kubernetes cluster kubeconfig save k8s-1-32-1-do-0-ams3-1740567483244

      - name: Installeren van de Metrics Server met Helm indien dit nog niet is gebeurd
        run: |
          echo "Controleren of Metrics Server al is geïnstalleerd..."
          if ! helm list -n kube-system | grep -q metrics-server; then
            echo "Metrics Server niet gevonden. Installeren met Helm..."
            helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ || echo "Repo bestaat al"
            helm repo update
            helm install metrics-server metrics-server/metrics-server -n kube-system
          else
            echo "Metrics Server is al geïnstalleerd."
          fi     

      - name: Podman login op de Digital Ocean Registry
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_USERNAME: ${{ secrets.DIGITALOCEAN_USERNAME }}
        run: |
          podman login registry.digitalocean.com -u "$DIGITALOCEAN_USERNAME" -p "$DIGITALOCEAN_ACCESS_TOKEN"

      - name: Update Kubernetes Secret met de Podman credentials
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_USERNAME: ${{ secrets.DIGITALOCEAN_USERNAME }}
        run: |
          kubectl delete secret registry-cicdrych -n default --ignore-not-found
          kubectl create secret docker-registry registry-cicdrych \
            --docker-server=registry.digitalocean.com \
            --docker-username="$DIGITALOCEAN_USERNAME" \
            --docker-password="$DIGITALOCEAN_ACCESS_TOKEN" \
            --namespace=default    

      - name: Update de Deployment YAML met een sha placeholder (image tag)
        run: |
          SHA_PLACEHOLDER="${{ github.sha }}"
          sed -i "s|image: registry.digitalocean.com/cicdrych/htmx-spring-boot:.*|image: registry.digitalocean.com/cicdrych/htmx-spring-boot:$SHA_PLACEHOLDER|g" kubernetes/deployment.yaml

      - name: Log de Deployment YAML om te zien of de configuratie goed staat
        run: cat kubernetes/deployment.yaml

      - name: Deployen naar Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl rollout restart deployment/htmx-spring-boot

      - name: De URL om naar de applicatie te navigeren
        run: |
          echo "Haalt het externe IP adres op via de load balancer..."
          APP_URL=$(kubectl get svc htmx-spring-boot-service -o=jsonpath='{.status.loadBalancer.ingress[0].ip}')

          if [ -z "$APP_URL" ]; then
            echo "ERROR: Helaas, geen extern IP adres gevonden voor de LoadBalancer!"
            exit 1
          fi

          FULL_URL="http://$APP_URL"

          echo "Applicatie is beschikbaar op: $FULL_URL"