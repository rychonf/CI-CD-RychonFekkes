name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Build en Push naar DigitalOcean Register
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codes
        uses: actions/checkout@v2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install doctl if not present
        run: |
          if ! command -v doctl &> /dev/null; then
            echo "doctl niet gevonden. Installeren..."
            curl -L https://github.com/digitalocean/doctl/releases/download/v1.87.0/doctl-1.87.0-linux-amd64.tar.gz -o doctl.tar.gz
            tar xzf doctl.tar.gz
            sudo mv doctl /usr/local/bin/
          else
            echo "doctl is al geïnstalleerd. Installatie overslaan."
          fi        

      - name: Log in to DigitalOcean Container Registry
        run: |
          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | podman login registry.digitalocean.com --username ${{ secrets.DIGITALOCEAN_USERNAME }} --password-stdin

      - name: Define image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Check existing images in DigitalOcean Registry
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          doctl registry repository list-manifests cicdrych/htmx-spring-boot

      - name: Delete old image from DigitalOcean Registry
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          doctl registry repository delete-manifest cicdrych/htmx-spring-boot --tag latest --force || echo "Geen oude 'latest' image gevonden, overslaan."

      - name: Build Docker image with Podman
        run: |
          podman build -t htmx-spring-boot:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to DigitalOcean Container Registry
        run: |
          podman tag localhost/htmx-spring-boot:${{ env.IMAGE_TAG }} registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}
          podman push registry.digitalocean.com/cicdrych/htmx-spring-boot:${{ env.IMAGE_TAG }}


  # Job 2: Deploy naar Kubernetes
  deploy:
    runs-on: ubuntu-latest
    needs: build  # Zorgt ervoor dat de deploy job alleen draait als de build job slaagt

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kubectl
        run: |
          if kubectl version --client &> /dev/null; then
            echo "Kubectl is al geïnstalleerd"
          else
            echo "Kubectl niet gevonden, installeren..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi

      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
          if [ ! -s kubeconfig ]; then
            echo "ERROR: Kubeconfig is leeg of verkeerd gedecodeerd!"
            exit 1
          fi
          mkdir -p ~/.kube
          mv kubeconfig ~/.kube/config
          chmod 600 ~/.kube/config
          export KUBECONFIG=~/.kube/config

#      - name: Debug Kubernetes Connection
#        run: |
#          ls -lah ~/.kube
#          cat ~/.kube/config
#          kubectl config view
#          kubectl cluster-info
#          kubectl get nodes

      - name: update image
        run: |
          IMAGE_NAME=registry.digitalocean.com/cicdrych/htmx-spring-boot:latest         
          sed -i "s|image: .*|image: $IMAGE_NAME|g" kubernetes/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
#          kubectl rollout status deployment/htmx-spring-boot